<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>蓉宠 · 小程序交互原型</title><style>
:root{--brand:#e97832;--ink:#362d27;--muted:#93867b;--bg:#faf7f2;--line:#eee6dd;--soft:#fff0e2}*{box-sizing:border-box}body{margin:0;background:#eee8e0;color:var(--ink);font:14px/1.6 'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--brand)}.desk{position:fixed;left:6vw;top:12vh;width:230px}.desk h1{font-size:36px;letter-spacing:3px;margin:0}.desk p{color:#817367}.desk b{color:var(--brand)}.phone{max-width:430px;margin:24px auto;background:var(--bg);min-height:calc(100vh - 48px);border:7px solid #39332e;border-radius:42px;overflow:hidden;position:relative;box-shadow:0 20px 70px #49362120}.status{display:flex;justify-content:space-between;padding:14px 23px 4px;font-size:12px;font-weight:700}.wx{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;border-bottom:1px solid #f1ebe3}.capsule{border:1px solid var(--line);border-radius:20px;padding:0 12px;letter-spacing:6px}main{padding:18px 18px 100px;min-height:720px}h2{font-size:24px;line-height:1.4;margin:0 0 5px}h3{font-size:17px;margin:0 0 12px}p{margin:6px 0}small,.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.avatar{background:#f4ddc3;border-radius:50%;width:45px;height:45px;display:grid;place-items:center;font-size:26px}.search{display:flex;gap:8px;background:white;border:1px solid var(--line);border-radius:15px;padding:9px 12px;margin:15px 0}.search input{border:0;outline:0;width:100%;background:none}.actions{display:grid;grid-template-columns:1fr 1fr;background:var(--brand);border-radius:20px;color:white;margin-bottom:14px;padding:19px 6px}.actions button{text-align:left;padding:0 14px}.actions button+button{border-left:1px solid #ffffff55}.actions .symbol{font-size:32px;line-height:1.2;margin-bottom:8px}.actions strong{display:block;font-size:17px}.actions small{color:#ffe6d3}.services{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:76px 76px;gap:10px;margin-bottom:23px}.service{background:#f6eadb;border-radius:17px;text-align:left;padding:14px;overflow:hidden;position:relative}.service.big{grid-row:span 2;background:#ffecd0}.service strong{display:block;font-size:17px}.service small{font-size:11px}.service.big img{width:100%;height:92px;object-fit:cover;border-radius:12px;margin-top:8px}.service:last-child{background:#eeeede}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:16px}.task{padding:11px 0;display:flex;gap:10px;align-items:center}.task+.task{border-top:1px solid var(--line)}.task img{width:48px;height:48px;border-radius:12px;object-fit:cover}.task .info{flex:1}.task small{display:block}.outline{border:1px solid #e6a47b;color:#b35f2c;border-radius:20px;padding:3px 12px;font-size:12px}.orange{color:var(--brand)}.pets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.pet{padding:0;text-align:left;background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.pet img{width:100%;height:88px;object-fit:cover}.pet div{padding:7px;font-size:12px}.pet strong{display:block}.nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#fffdf9ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 3px 15px;z-index:5}.nav button{flex:1;font-size:11px;color:#8a8077}.nav span{display:block;font-size:23px;line-height:1.3}.nav .active{color:var(--brand);font-weight:bold}.hero{width:calc(100% + 36px);margin:-18px -18px 17px;height:245px;object-fit:cover}.tag{display:inline-block;padding:3px 9px;border-radius:8px;background:var(--soft);color:#bc672c;font-size:12px;margin:4px 4px 4px 0}.primary{background:var(--brand);color:white;border-radius:13px;padding:12px 18px;font-weight:bold;display:block;width:100%;margin-top:12px}.secondary{background:#f3ece3;border-radius:13px;padding:10px;width:100%;margin-top:10px}.field{display:block;margin:14px 0;font-weight:bold}.field input,.field select,.field textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);background:white;padding:11px;border-radius:11px;font-weight:normal;color:var(--ink)}textarea{min-height:100px;resize:vertical}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.chips button{border-radius:20px;padding:6px 13px;background:white;border:1px solid var(--line)}.chips .chosen{color:white;background:var(--brand);border-color:var(--brand)}.listitem{width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.notice{padding:10px 12px;background:var(--soft);border-radius:11px;color:#a7663c;font-size:12px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#362d27ed;color:white;border-radius:12px;padding:12px 22px;z-index:30;max-width:85vw;text-align:center}.detailbar{position:sticky;bottom:70px;background:var(--bg);padding:10px 0}.upload{border:1px dashed #d7bda4;border-radius:12px;padding:16px;text-align:center;background:#fffaf4}.money{font-size:29px;font-weight:bold;color:var(--brand)}.back{font-size:20px;padding:0 10px 0 0}.hint{font-size:11px;text-align:center;color:#ab9b8e;margin-top:25px}a{color:var(--brand)}@media(max-width:980px){.desk{display:none}}@media(max-width:480px){body{background:var(--bg)}.phone{border:0;border-radius:0;margin:0;max-width:none;min-height:100vh;box-shadow:none}main{min-height:calc(100vh - 90px)}.nav{position:fixed;max-width:480px;margin:auto}} 
.petroom{height:310px;border-radius:100px 100px 25px 25px;background:linear-gradient(#fff2de,#f7dfc2);position:relative;overflow:hidden;text-align:center;border:1px solid #efdbbf}.roomcaption{padding-top:22px;font-size:12px;color:#a7825c;letter-spacing:2px}.speech{background:#fffdf8;border-radius:18px;padding:8px 14px;display:inline-block;margin-top:14px;font-size:12px;color:#936340;position:relative;z-index:2}.character{position:absolute;left:50%;transform:translateX(-50%);top:95px;width:175px;z-index:2}.character svg{width:100%;filter:drop-shadow(0 8px 4px #94613722)}.rug{position:absolute;background:#eac395;width:230px;height:45px;border-radius:50%;bottom:35px;left:50%;transform:translateX(-50%)}.roomplant{position:absolute;left:23px;bottom:44px;font-size:65px;color:#94a27b}.roomstar{position:absolute;right:28px;top:110px;color:#d49c54;font-size:36px}.roomlabel{position:absolute;bottom:12px;text-align:center;width:100%;font-size:10px;color:#a38161}.bouncy{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translate(-50%,-7px)}}@media(prefers-reduced-motion:reduce){.bouncy{animation:none}}.companion{margin-top:18px;background:#fffaf2}.companion h3 small{font-size:10px;font-weight:normal;margin-left:8px}.pettools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.pettools button{padding:12px 3px;border-radius:14px;background:#fff0df}.pettools span{display:block;font-size:25px;color:#c46c32;line-height:1.4}.pettools b{display:block;font-size:14px}.pettools small{display:block;font-size:10px;margin-top:3px}.errands .pettools button{background:#f8f5ef}.interaction-note{font-size:11px;color:#a17d5c;text-align:center;margin:12px 0 0}.character.pet-touch{animation:petTouch .6s ease 2}.character.pet-feed{animation:petFeed .5s ease 3}.character.pet-play{animation:petPlay .5s ease 3}@keyframes petTouch{50%{transform:translate(-50%,-4px) rotate(-8deg)}}@keyframes petFeed{50%{transform:translate(-50%,5px) scale(1.04,.96)}}@keyframes petPlay{50%{transform:translate(-50%,-22px) rotate(7deg)}}@media(prefers-reduced-motion:reduce){.character.pet-touch,.character.pet-feed,.character.pet-play{animation:none}}</style></head><body><aside class="desk"><h1>蓉宠<span class="orange">.</span></h1><p>成都宠物本地信任平台</p><p><b>C 功能工作台 / 奶油橙</b></p><p>点击右侧页面体验主要流程。<br>这是使用模拟数据的交互原型。</p><p>寻宠招领 · 线索认领<br>上门喂养 · 多宠档案</p><small>原型数据保存在当前浏览器<br><button onclick="reset()" style="color:#b96938;padding:8px 0">重置演示数据 ↻</button></small></aside><div class="phone"><div class="status"><span>9:41</span><span>▮▮▮　◉　▰</span></div><header class="wx"><span id="header">蓉宠</span><span class="capsule">••• ◉</span></header><main id="app"></main><nav class="nav" id="nav"></nav></div><div id="toast"></div><script>
const cat='https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=600&auto=format&fit=crop',dog='https://images.unsplash.com/photo-1552053831-71594a27632d?w=600&auto=format&fit=crop',gray='https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&auto=format&fit=crop';
const seed={posts:[{id:1,name:'年糕',type:'寻宠',district:'武侯区',reward:500,img:cat,desc:'橘猫，公，2岁，性格亲人。11月6日在玉林西路附近走失，看到的朋友请提供线索。',status:'展示中'},{id:2,name:'豆豆',type:'招领',district:'锦江区',reward:0,img:dog,desc:'在小区附近发现一只亲人的狗狗，请失主提供证明材料认领。',status:'展示中'},{id:3,name:'糯米',type:'寻宠',district:'成华区',reward:300,img:gray,desc:'灰色猫咪，戴有项圈，请附近的朋友帮忙留意。',status:'展示中'}],pets:[{name:'年糕',kind:'橘猫 · 2岁',img:cat},{name:'团团',kind:'金毛 · 3岁',img:dog}],clues:[],claims:[],requests:[],messages:[],saved:[],tops:[]};let data;try{data=JSON.parse(localStorage.getItem('rongpet-demo-v1'))||structuredClone(seed)}catch{data=structuredClone(seed)}data.feedbacks=Array.isArray(data.feedbacks)?data.feedbacks:[];let page='home',args={},filter='全部',history=[],district='全成都';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('rongpet-demo-v1',JSON.stringify(data))}function toast(t){$('#toast').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('#toast').innerHTML='',2400)}function go(p,a={}){history.push([page,args]);page=p;args=a;render();window.scrollTo(0,0)}function back(){[page,args]=history.pop()||['home',{}];render()}function reset(){localStorage.removeItem('rongpet-demo-v1');location.reload()}function message(t){data.messages.unshift({text:t,time:new Date().toLocaleString()});save()}function title(t){return `<h2>${t}</h2>`}function card(p){return `<button class="pet" onclick="go('detail',{id:${p.id}})"><img src="${p.img}" alt="${esc(p.name)}"><div><strong>${esc(p.name)} · ${p.type}</strong><span class="orange">${p.reward?'¥'+p.reward:'免费互助'}</span><br><small>${esc(p.district)}</small></div></button>`}function field(label,name,placeholder='',type='text'){return `<label class="field">${label}<input name="${name}" type="${type}" placeholder="${placeholder}" required maxlength="100"></label>`}function selectedPost(){return data.posts.find(p=>p.id===args.id)||data.posts[0]}function handleSubmit(e,fn){e.preventDefault();fn(Object.fromEntries(new FormData(e.target)))}
function render(){const tabs=[['home','⌂','首页'],['pets','♧','爱宠'],['messages','♧','消息'],['mine','♙','我的']];$('#nav').innerHTML=tabs.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${t}</button>`).join('');$('#header').innerHTML=page==='home'?'蓉宠':`<button class="back" onclick="back()">‹</button> 蓉宠`;let html='';
if(page==='home'){html=`<div class="row"><div><h2>你好，小满 <span style="font-size:20px">☀</span></h2><small>⌖ 成都 · 武侯区</small></div><button class="avatar" onclick="go('mine')">☺</button></div><form class="search" onsubmit="event.preventDefault();go('list',{q:this.q.value})"><span>⌕</span><input name="q" placeholder="搜索求助、宠物、服务"><button>搜索</button></form><div class="actions"><button onclick="go('publish',{type:'寻宠'})"><div class="symbol">♧</div><strong>我丢了宠物</strong><small>发布寻宠 ›</small></button><button onclick="go('publish',{type:'招领'})"><div class="symbol">♧</div><strong>我捡到宠物</strong><small>发布招领 ›</small></button></div><div class="services"><button class="service big" onclick="go('feeding')"><strong>上门喂养 ›</strong><small>找到附近实名喂养员</small><img src="${dog}" alt="狗狗"></button><button class="service" onclick="go('match')"><strong>♡ 宠物相亲 ›</strong><small>为爱宠寻找合适伙伴</small></button><button class="service" onclick="go('found')"><strong>✓ 已找回 ›</strong><small>看看大家的好消息</small></button></div><div class="card"><h3>我的进行中</h3><div class="task"><img src="${cat}" alt="年糕"><div class="info"><b>寻宠帖「年糕」</b><small class="orange">${data.clues.length+2} 条线索待查看</small></div><button class="outline" onclick="go('progress')">查看</button></div><div class="task"><img src="${dog}" alt="喂养"><div class="info"><b>我的喂养请求</b><small>${data.requests.length?data.requests.length+' 条请求已提交':'暂未发起请求'}</small></div><button class="outline" onclick="go('requests')">查看</button></div></div><div class="row"><h3>附近最新求助</h3><button class="muted" onclick="go('list')">查看更多 ›</button></div><div class="pets">${data.posts.slice(0,3).map(card).join('')}</div>`}
if(page==='list'){html=title('寻宠与招领')+`<form class="search" onsubmit="event.preventDefault();args.q=this.q.value;render()"><input name="q" value="${esc(args.q||'')}" placeholder="搜索宠物名字、描述"><button>搜索</button></form><div class="chips">${['全部','寻宠','招领'].map(t=>`<button class="${filter===t?'chosen':''}" onclick="filter='${t}';render()">${t}</button>`).join('')}<select aria-label="区县" onchange="district=this.value;render()">${['全成都','武侯区','锦江区','成华区'].map(d=>`<option ${district===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="pets" style="grid-template-columns:1fr 1fr">${data.posts.filter(p=>(filter==='全部'||p.type===filter)&&(district==='全成都'||p.district===district)&&(!args.q||(p.name+p.desc).includes(args.q))).map(card).join('')||'<p class="empty">暂时没有匹配的帖子</p>'}</div><button class="primary" onclick="go('publish',{type:'寻宠'})">＋ 发布求助</button>`}
if(page==='detail'){const p=selectedPost();html=`<img class="hero" src="${p.img}" alt="${esc(p.name)}"><div class="row"><h2>${p.type==='招领'?'等待主人':'寻找'}「${esc(p.name)}」</h2><button class="outline" onclick="toggleSave(${p.id})">${data.saved.includes(p.id)?'已收藏':'♡ 收藏'}</button></div><span class="tag">${p.status}</span><span class="tag">${esc(p.district)}</span><span class="tag">${p.type}</span>${p.reward?'<p class="money">悬赏 ¥'+p.reward+'</p>':''}<div class="card" style="margin-top:16px"><h3>详细描述</h3><p>${esc(p.desc)}</p><small>地点：成都 · ${esc(p.district)} · 玉林附近</small></div><div class="notice">${p.type==='招领'?'认领申请先经审核，再由拾宠人核验。确认前不公开双方联系方式。':'请提供真实有效线索。悬赏分配需经确认、评分与人工核验。'}</div><div class="detailbar"><button class="primary" onclick="go('${p.type==='招领'?'claim':'clue'}',{id:${p.id}})">${p.type==='招领'?'我是失主 · 申请认领':'提供线索'}</button><button class="secondary" onclick="toast('演示联系方式：139****6821，请通过线索流程联系')">联系发布者</button></div>`}
if(page==='publish'){html=title('发布'+(args.type||'寻宠'))+`<div class="notice">填写信息后提交审核，审核通过后展示。悬赏和置顶支付在本原型中仅作流程演示。</div><form onsubmit="handleSubmit(event,publish)"><label class="field">从宠物档案填写<select name="pet" onchange="fillPet(this.value)"><option value="">手动填写</option>${data.pets.map((p,i)=>`<option value="${i}">${esc(p.name)}</option>`).join('')}</select></label>${field('宠物称呼','name','例如：年糕')}<label class="field">所属区县<select name="district"><option>武侯区</option><option>锦江区</option><option>成华区</option><option>高新区</option></select></label>${field('事件日期','date','','date')}<label class="field">详细描述<textarea name="desc" required minlength="10" maxlength="500" placeholder="宠物特征、发现或走失位置（至少10字）"></textarea></label><label class="field">宠物照片<input name="photo" type="file" accept="image/*" onchange="previewFile(this)"></label><div id="photoPreview"></div>${args.type!=='招领'?'<label class="field">自愿悬赏金额（元）<input name="reward" type="number" min="100" max="10000" placeholder="不填写则免费发布"></label>':''}<label><input type="checkbox" required> 我确认信息真实并同意发布规则</label><button class="primary">提交审核</button></form>`}
if(page==='clue'||page==='claim'){const claim=page==='claim';html=title(claim?'提交认领申请':'提供线索')+`<p class="muted">关联帖子：${esc(selectedPost().name)}</p><form onsubmit="handleSubmit(event,${claim?'addClaim':'addClue'})"><label class="field">${claim?'说明你与宠物的关系':'你发现了什么'}<textarea name="content" minlength="10" maxlength="500" required placeholder="请详细填写，至少10字"></textarea></label>${field('联系电话','phone','请输入11位手机号','tel')}<label class="field">${claim?'证明材料（至少2张）':'现场照片（可选）'}<input name="proof" type="file" accept="image/*" multiple ${claim?'required':''}></label><div class="notice">${claim?'材料仅供审核与拾宠人核验，其他申请人不可见。':'请勿提交虚假线索或重复内容。'}</div><button class="primary">确认提交</button></form>`}
if(page==='feeding'){html=title('上门喂养')+(args.pet!==undefined?'<p class="tag">为 '+esc(data.pets[args.pet].name)+' 寻找照顾</p>':'')+'<p class="muted">出差、旅行，让爱宠有人照顾</p><div class="notice">平台仅提供信息对接，不收取喂养费用或押金。</div>'+[{name:'小林',area:'武侯区 · 玉林 / 桐梓林',price:50},{name:'阿乔',area:'锦江区 · 东湖 / 三圣',price:60}].map((f,i)=>`<div class="card" style="margin-top:15px"><div class="row"><div class="avatar">${i?'☺':'♧'}</div><div style="flex:1"><h3 style="margin:0">${f.name} <span class="tag">已实名核验</span></h3><small>${f.area}</small></div></div><p>猫狗照护 · 换水添粮 · 清洁陪伴</p><p class="orange">参考 ¥${f.price} / 次 <small>双方自行协商</small></p><button class="primary" onclick="go('feedForm',{feeder:'${f.name}',pet:${args.pet===undefined?'undefined':args.pet}})">发起喂养请求</button></div>`).join('')}

  extra(title('搜索结果')+`<p class="muted">搜索公开帖子和喂养员，不搜索私有档案与会话。</p><form class="search" onsubmit="event.preventDefault();args.q=this.q.value;render()"><input name="q" value="${esc(q)}" placeholder="品种、关键词或区县"><button>搜索</button></form><h3>帖子</h3><div class="pets">${q?posts.map(card).join('')||'暂无匹配内容':'输入关键词开始搜索'}</div><h3 style="margin-top:25px">喂养员</h3>${q&&/小林|喂养|武侯|玉林/.test(q)?'<button class="card" onclick="go(\'feederDetail\',{feeder:\'小林\'})">小林 · 武侯区 · 已实名核验 ›</button>':'<p class="muted">暂无匹配喂养员</p>'}`)
 }
 if(page==='found'){
  const found=data.posts.filter(p=>p.found);extra(title('它们回家了')+(found.length?found.map(p=>`<div class="card"><img src="${p.img}" style="width:100%;border-radius:12px" alt="已找回宠物"><h3>${esc(p.name)}回家了</h3><p>${esc(p.story||'谢谢每一份关心')}</p><p class="orange">${p.splitStatus==='已转付'?'共向 '+p.recipientCount+' 位线索提供者分配 ¥'+p.reward:'找回已确认，分配结果待核验'}</p><small>不公开联系方式、收款账户或个人分配明细。</small></div>`).join(''):'<div class="empty">期待第一条真实的团圆消息。</div>'))
 }
 if(page==='poster')extra(title('分享海报预览')+`<div class="card" style="text-align:center"><h2>蓉宠 · 让爱回家</h2><img src="${selectedPost().img}" style="width:100%;border-radius:14px" alt="宠物"><h3>${esc(selectedPost().name)}</h3><p>${esc(selectedPost().district)}</p><div style="padding:20px;border:2px dashed #e5c8ad">正式版小程序码区域</div><small>演示预览，不含可扫码小程序码。正式海报由服务端生成。</small></div>`);
 if(page==='feedbackForm'){document.querySelector('[name=contact]')?.closest('label')?.remove()}
 if(page==='feedbackDetail')document.querySelectorAll('#app details').forEach(d=>d.remove());
};

function fillExpandedPet(i){const p=data.pets[i];if(!p)return;const f=$('#postForm');for(const [k,v] of Object.entries({name:p.name,breed:p.breed||p.kind?.split(' · ')[0],gender:p.gender||'未知',petType:p.petType||'猫'}))if(f.elements[k])f.elements[k].value=v}
function saveDraft(){const f=Object.fromEntries(new FormData($('#postForm')));delete f.photos;data.postDraft={...f,type:args.type};save();toast('草稿已保存，可从我的帖子继续')}
function confirmPublish(f){const files=$('[name=photos]').files;if(files.length>9||[...files].some(f=>f.size>5*1024*1024))return toast('图片最多9张，每张不超过5MB');if(!validPhone(f.phone))return toast('请输入有效手机号');if(new Date(f.eventTime)>new Date())return toast('发生时间不能晚于现在');if(args.editId&&byId(args.editId).editCount)return toast('展示中帖子仅可编辑一次');const proceed=img=>go('confirmPost',{type:args.type,form:f,img,editId:args.editId});if(files[0]){const r=new FileReader();r.onload=()=>proceed(r.result);r.readAsDataURL(files[0])}else proceed(args.editId?byId(args.editId).img:cat)}
function finishPublish(){const f=args.form,id=args.editId||Date.now(),old=byId(id);const p={...old,...f,id,type:args.type,reward:Number(f.reward||0),days:Number(f.days||7),img:args.img,status:'待审核',mine:true,editCount:old?(old.editCount||0)+1:0};if(old)data.posts[data.posts.indexOf(old)]=p;else data.posts.unshift(p);if(f.saveAsPet)data.pets.push({name:f.name,kind:f.breed,breed:f.breed,gender:f.gender,petType:f.petType,img:args.img});delete data.postDraft;addNotice('帖子已提交审核',{post:id});go('myPosts')}
function simulateAudit(id,pass){const p=byId(id);p.status=pass?'展示中':'已驳回';addNotice(pass?'帖子已通过审核，可按需支付悬赏':'帖子被驳回，请完善内容后重新提交',{post:id});render()}
function extendPost(id){const p=byId(id);if(p.extended)return toast('每帖只能延长一次');p.extended=true;save();toast('已模拟延长一次，不重复收取服务费');render()}
function takeDown(id){const p=byId(id);if(p.rewardPaid&&!p.found)return toast('存在未结悬赏，请先处理资金与线索');p.status='已下架';save();go('myPosts')}
function simulateRewardPay(id){const p=byId(id);p.rewardPaid=true;p.status='悬赏托管中';p.expiry=Date.now()+(p.days||7)*86400000;data.payments.unshift({id:Date.now(),type:'悬赏',amount:p.reward+Math.min(p.reward*.08,80),status:'已托管',post:id});addNotice('模拟悬赏支付成功',{post:id});go('managePost',{id})}
function buyTop(id,price,days){const p=byId(id);if(!['展示中','悬赏托管中'].includes(p.status))return toast('请审核通过后再置顶');p.topUntil=Date.now()+days*86400000;data.payments.unshift({id:Date.now(),type:'置顶',amount:price,status:'演示生效',post:id});save();go('orders')}
function freeTop(id){const p=byId(id);if(p.freeApplied)return toast('每帖只能申请一次');const month=new Date().toISOString().slice(0,7);data.freeMonths??={};if((data.freeMonths[month]||0)>=2)return toast('本月申请次数已达2次');p.freeApplied=true;data.freeMonths[month]=(data.freeMonths[month]||0)+1;save();toast('免费置顶申请已提交人工核验')}
function seedClue(post){data.ownClues.push({id:Date.now(),post,author:'热心邻居'+(data.ownClues.length+1),content:'在玉林附近看到相似宠物，有现场情况可供核实。',status:'待确认'});save();render()}
function markClue(id,on){const c=data.ownClues.find(c=>c.id===id);if(on&&data.ownClues.filter(x=>x.post===c.post&&x.status==='有效').length>=5)return toast('有效线索最多5条');c.status=on?'有效':'无效';save();render()}
function finishFound(id,form){const p=byId(id);p.found=true;p.story=form.story.value;p.status=p.rewardPaid?'待评分核验':'已完成';p.splitStatus='待人工核验';addNotice('找回已确认，悬赏不再进入未找回退款流程',{post:id});go('found')}
addClue=function(f){if(!validPhone(f.phone))return toast('手机号格式不正确');const p=selectedPost();if(p.mine)return toast('不能给自己的帖子提供线索');if(data.clues.filter(c=>c.post===args.id).length>=3)return toast('同一帖子最多提交3条线索');data.clues.unshift({post:args.id,content:f.content,phone:f.phone});addNotice('线索已提交，若已协助找回而存在争议，可提交证据',{post:args.id});go('myClues')};
addClaim=function(f){if(!validPhone(f.phone))return toast('手机号格式不正确');if($('[name=proof]').files.length<2)return toast('至少上传2张证明材料');if(data.claims.filter(c=>c.post===args.id).length>=20)return toast('该帖申请数已达上限');data.claims.push({id:Date.now(),post:args.id,content:f.content,status:'待审核'});addNotice('认领申请已提交，等待审核');go('myClaims')};
function cConfirm(id,on){const c=data.claims.find(c=>c.id===id);c.status=on?'已确认':'已拒绝';save();render()}
function addRequestV14(f){if(!validPhone(f.phone))return toast('请输入有效手机号');if(new Date(f.time)<=new Date())return toast('请选择未来时间');if(f.serviceType==='按日上门'&&(!f.endTime||new Date(f.endTime)<=new Date(f.time)||!f.dailyTime))return toast('请填写有效结束时间和每日时段');data.requests.unshift({...f,pet:data.pets[Number(f.pet)]?.name||'爱宠',feeder:args.feeder,status:'待响应',id:Date.now()});addNotice('喂养请求已提交，48小时未响应自动关闭');go('requests')}
function savePetV14(f){const file=$('[name=avatar]').files[0];const complete=img=>{const p={...data.pets[args.index],id:data.pets[args.index]?.id||Date.now(),...f,img,kind:f.breed+(f.birthday?' · '+f.birthday:'')};if(args.index!==undefined)data.pets[args.index]=p;else data.pets.push(p);save();go('pets')};if(file){if(file.size>5*1024*1024)return toast('图片请小于5MB');const reader=new FileReader();reader.onload=()=>complete(reader.result);reader.readAsDataURL(file)}else complete(data.pets[args.index]?.img||cat)}
function deletePet(i){data.pets.splice(i,1);save();go('pets')}
function simulateAvatar(form){const p=data.pets[args.index];if((p.avatarUsed||0)>=3)return toast('免费次数已用完，价格待配置');const b=form.querySelector('button');b.disabled=true;b.textContent='生成流程演示中…';const index=args.index,style=form.elements.style.value;setTimeout(()=>{p.avatarUsed=(p.avatarUsed||0)+1;p.aiDemo=true;data.avatarHistory.push({petId:p.id,style,time:localTime()});save();go('pets',{index});toast('演示完成，展示通用插画，并非真实AI结果')},1200)}
function readNotice(i){const m=data.messages[i];m.read=true;save();if(m.feedbackId)go('feedbackDetail',{id:m.feedbackId});else if(m.post)go('detail',{id:m.post});else render()}
function sendChat(text){if(/1[3-9][\s\d-]{9,}|https?:\/\/|微信|加微|收款|转账|二维码|wx[:：]/i.test(text))return toast('请勿发送联系方式、外链或私下付款信息');const c=data.chats.find(c=>c.post===args.id);c.texts.push({text,mine:true,time:localTime()});save();render()}
function feederAction(id,status){const r=data.requests.find(r=>r.id===id);if(status==='已完成'&&r.status!=='已联系')return toast('先标记已联系');r.status=status;save();render()}
function cancelDemoAccount(){if(data.posts.some(p=>p.mine&&!['已下架','已完成','已过期'].includes(p.status))||data.requests.some(r=>!['已完成','已关闭'].includes(r.status))||data.payments.some(p=>p.status==='已托管'))return toast('存在进行中业务，请先完成处置');data.phoneBound=false;save();go('home');toast('模拟注销完成')}
render();

card=function(p){const paid=p.rewardPaid||p.status==='悬赏托管中';return `<button class="pet" onclick="go('detail',{id:${p.id}})"><img src="${p.img}" alt="${esc(p.name)}"><div><strong>${esc(p.name)} · ${esc(p.type)}</strong><span class="orange">${paid&&p.reward?'悬赏 ¥'+p.reward:'免费互助'}</span><br><small>${esc(p.district)}</small></div></button>`};
render();

</script><!-- V14_EXTENSION_END --></body></html>
