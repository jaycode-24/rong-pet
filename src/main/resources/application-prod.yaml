# 生产环境配置：所有敏感项必须由环境变量注入，本文件不得出现明文密钥。
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=false
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    druid:
      initial-size: 3
      min-idle: 3
      max-active: 15
      max-wait: 10000
      # 生产环境关闭 Druid 监控面板，避免 /druid 暴露
      stat-view-servlet:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

sa-token:
  is-log: false

logging:
  level:
    root: info
    com.jaycode.rongpet: info
