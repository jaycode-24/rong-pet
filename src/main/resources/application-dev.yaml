# 本地开发环境配置。含仅用于本地联调的固定密钥，禁止用于生产。
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rong_pet?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

logging:
  level:
    com.jaycode.rongpet: debug

rongpet:
  crypto:
    # 32 字节 AES-256 密钥（base64），本地固定值仅用于联调，生产必须通过环境变量覆盖
    aes-key: joIdvmFpIKtUlAg2LBRwIddCerDmSxDil3wkMul2yCo=
    hmac-key: ZWcaoeDfFw/0dIxmtf8mYNJX08XYJssUcxd6ht+/BcQ=
  wx:
    ma:
      # 本地无微信凭证时的 mock 登录开关，按 code 生成确定性假 openid
      mock: ${WX_MA_MOCK:true}
  pay:
    # 本地无商户凭证时使用 mock 支付通道，创建即视为支付成功
    mock: ${WX_PAY_MOCK:true}
  dev:
    # 仅 dev 生效：账号表为空时初始化的默认管理员
    admin-username: admin
    admin-password: Admin@123456
  upload:
    # 本地无 COS 凭证时的图片存储兜底，仅用于联调
    local-enabled: ${UPLOAD_LOCAL_ENABLED:true}
    local-dir: ./data/uploads
