server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: rong-pet
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.jaycode.rongpet.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-read-cookie: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: app
      paths-to-match: /app/v1/**
    - group: admin
      paths-to-match: /admin/v1/**
    - group: callback
      paths-to-match: /callback/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 平台自定义配置
rongpet:
  # 敏感字段加解密（AES-GCM 密文 + HMAC 检索索引），密钥仅从环境变量注入，禁止入库入 git
  crypto:
    aes-key: ${RONGPET_CRYPTO_AES_KEY:}
    hmac-key: ${RONGPET_CRYPTO_HMAC_KEY:}
  # 微信小程序 / 微信支付，未配置时不实例化对应 Bean；mock 仅在 dev 联调时开启
  wx:
    ma:
      appid: ${WX_MA_APPID:}
      secret: ${WX_MA_SECRET:}
      mock: ${WX_MA_MOCK:false}
    pay:
      app-id: ${WX_PAY_APPID:}
      mch-id: ${WX_PAY_MCH_ID:}
      mch-key: ${WX_PAY_MCH_KEY:}
      api-v3-key: ${WX_PAY_API_V3_KEY:}
      cert-serial-no: ${WX_PAY_CERT_SERIAL:}
      private-key-path: ${WX_PAY_PRIVATE_KEY_PATH:}
      notify-url: ${WX_PAY_NOTIFY_URL:}
  # 腾讯云 COS（图片私有 bucket + 预签名访问）
  cos:
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-chengdu}
    bucket: ${COS_BUCKET:}
    prefix: ${COS_PREFIX:rong-pet}
    presign-expire-seconds: 600
  # 图片上传：生产必须走 COS；本地联调可临时开启本地目录兜底
  upload:
    max-size: 5242880
    local-enabled: false
    local-dir: ./data/uploads
    local-base-url: /files
